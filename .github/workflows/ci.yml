name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |
          ruff check user-service product-service order-service notification-service --select E9,F63,F7,F82

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build


  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest


    if: github.event_name == 'push'

    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: |
            ghcr.io/neutron017/markethub-user-service:latest
            ghcr.io/neutron017/markethub-user-service:${{ github.sha }}

      - name: Build and push product-service
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: |
            ghcr.io/neutron017/markethub-product-service:latest
            ghcr.io/neutron017/markethub-product-service:${{ github.sha }}

      - name: Build and push order-service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: |
            ghcr.io/neutron017/markethub-order-service:latest
            ghcr.io/neutron017/markethub-order-service:${{ github.sha }}

      - name: Build and push notification-service
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          push: true
          tags: |
            ghcr.io/neutron017/markethub-notification-service:latest
            ghcr.io/neutron017/markethub-notification-service:${{ github.sha }}