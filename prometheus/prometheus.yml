global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "user-service:8000"

  - job_name: "product-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "product-service:8000"
          - "product-service-2:8000"

  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "order-service:8000"

  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "notification-service:8000"